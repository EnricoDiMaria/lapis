name: release-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      CARGO_TARGET_DIR: C:\t
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - uses: Swatinem/rust-cache@v2

      - name: Read version from Cargo.toml
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $v = $m.Matches[0].Groups[1].Value
          # su un tag la versione di Cargo.toml deve coincidere (v1.2.0 <-> 1.2.0)
          # (sono ammessi suffissi di pre-release: v1.2.0-rc1)
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -notmatch "^v$([regex]::Escape($v))(-.+)?$") {
            throw "Il tag $env:GITHUB_REF_NAME non coincide con la versione di Cargo.toml ($v)"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build
        run: cargo build --release --locked

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          # lo script .iss si aspetta target\release: copia dal target dir corto
          New-Item -ItemType Directory -Force target/release | Out-Null
          Copy-Item C:\t\release\lapis.exe target\release\lapis.exe
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\lapis.iss "/DAppVersion=${{ steps.ver.outputs.version }}"

      - name: Zip portabile (per install.ps1)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/zip | Out-Null
          Copy-Item C:\t\release\lapis.exe dist/zip/
          Copy-Item packaging/windows/install-deps.ps1 dist/zip/
          Compress-Archive dist/zip/* dist/lapis-windows-x86_64.zip -Force

      - name: Checksums SHA256
        shell: pwsh
        run: |
          Get-ChildItem dist/lapis-* -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content dist/SHA256SUMS-windows.txt
          Get-Content dist/SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/lapis-*
            dist/SHA256SUMS-windows.txt

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/lapis-*-setup.exe
            dist/lapis-windows-x86_64.zip
            dist/SHA256SUMS-windows.txt
